[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigdeck"
version = "2.1.0"
description = "Offline Ed25519 signing toolkit - pure-python RFC 8032, armor, QR exchange"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ed25519", "signing", "cryptography", "offline", "air-gapped"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
